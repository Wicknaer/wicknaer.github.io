---
layout: default
---
<header class="page__head">
  <div class="wrap">
    <p class="eyebrow">~/{{ page.url | split: "/" | last }}</p>
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.description %}<p class="page__lead">{{ page.description }}</p>{% endif %}
  </div>
</header>
<div class="wrap page__body">
  {{ content }}
</div>
